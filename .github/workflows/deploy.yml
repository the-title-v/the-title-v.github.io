name: Verify and deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour; GitHub may delay scheduled runs.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Import private calendars into sanitized snapshots
        if: github.event_name != 'pull_request'
        run: npm run sync:availability
        env:
          AIRBNB_ICAL_BRIGHT: ${{ secrets.AIRBNB_ICAL_BRIGHT }}
          AIRBNB_ICAL_COZY: ${{ secrets.AIRBNB_ICAL_COZY }}
      - run: npm run build
        env:
          SITE_URL: https://the-title-v.github.io
      - run: npm run verify:build
        env:
          VERIFY_FRESH_AVAILABILITY: ${{ github.event_name != 'pull_request' && '1' || '0' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
